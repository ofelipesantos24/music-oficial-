<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonora — seu som, do seu jeito</title>
  <meta name="description" content="Sonora, um player de música web inspirado no Spotify. Ouça playlists, controle a reprodução e curta suas faixas favoritas." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">◍</span>
        <span class="brand-name">Sonora</span>
      </div>

      <nav class="nav-main">
        <button class="nav-item active" data-view="home">
          <span class="icon">⌂</span> Início
        </button>
        <button class="nav-item" data-view="search">
          <span class="icon">⌕</span> Buscar
        </button>
      </nav>

      <div class="library">
        <div class="library-header">
          <span class="icon">☰</span>
          <span>Sua biblioteca</span>
          <button id="btn-new-playlist" title="Criar playlist">＋</button>
        </div>
        <ul id="playlist-list" class="playlist-list"></ul>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <header class="topbar">
        <div class="search-box" id="search-box">
          <span class="icon">⌕</span>
          <input type="text" id="search-input" placeholder="O que você quer ouvir?" />
        </div>
        <div class="profile-pill">EU</div>
      </header>

      <section id="view-home" class="view">
        <h1 class="greeting" id="greeting">Boa noite</h1>

        <section class="row-block">
          <div class="row-head">
            <h2>Tocadas recentemente</h2>
          </div>
          <div class="quick-grid" id="recent-grid"></div>
        </section>

        <section class="row-block">
          <div class="row-head">
            <h2>Feito para você</h2>
          </div>
          <div class="card-row" id="made-for-you"></div>
        </section>

        <section class="row-block">
          <div class="row-head">
            <h2>Playlists em destaque</h2>
          </div>
          <div class="card-row" id="featured-row"></div>
        </section>
      </section>

      <section id="view-search" class="view hidden">
        <h1 class="greeting">Buscar</h1>
        <div id="search-results" class="card-row"></div>
      </section>

      <section id="view-playlist" class="view hidden">
        <div class="playlist-header">
          <div class="playlist-cover" id="pl-cover">♫</div>
          <div class="playlist-meta">
            <span class="eyebrow">Playlist</span>
            <h1 id="pl-title">—</h1>
            <p id="pl-desc" class="muted"></p>
            <p id="pl-count" class="muted small"></p>
          </div>
        </div>
        <div class="track-table" id="pl-tracks"></div>
      </section>
    </main>

    <!-- PLAYER BAR -->
    <footer class="player-bar">
      <div class="np-info">
        <div class="np-cover" id="np-cover">♫</div>
        <div class="np-text">
          <div class="np-title" id="np-title">Nenhuma faixa tocando</div>
          <div class="np-artist" id="np-artist">—</div>
        </div>
        <button class="like-btn" id="btn-like" title="Curtir">♡</button>
      </div>

      <div class="np-controls">
        <div class="control-buttons">
          <button id="btn-shuffle" title="Aleatório">⇄</button>
          <button id="btn-prev" title="Anterior">⏮</button>
          <button id="btn-play" class="play-main" title="Tocar/Pausar">▶</button>
          <button id="btn-next" title="Próxima">⏭</button>
          <button id="btn-repeat" title="Repetir">↻</button>
        </div>
        <div class="seek-row">
          <span id="time-current" class="time">0:00</span>
          <input type="range" id="seek" min="0" max="100" value="0" step="0.1" />
          <span id="time-total" class="time">0:00</span>
        </div>
      </div>

      <div class="np-extra">
        <span class="icon">🔊</span>
        <input type="range" id="volume" min="0" max="100" value="70" />
      </div>
    </footer>
  </div>

  <audio id="audio"></audio>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
